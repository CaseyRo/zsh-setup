name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          echo "::group::Syntax checking all .sh files"
          failed=0
          while IFS= read -r -d '' file; do
            if ! bash -n "$file" 2>&1; then
              echo "::error file=$file::Syntax error"
              failed=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if [[ "$failed" -eq 1 ]]; then
            echo "::error::Syntax check failed"
            exit 1
          fi
          echo "All files passed syntax check"
          echo "::endgroup::"

      - name: ShellCheck (installer scripts)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: .
          ignore_paths: modules preload_configs
          ignore_names: .zshrc

      - name: ShellCheck (runtime modules, bash mode)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          echo "::group::Runtime modules + preload_configs"
          mapfile -t targets < <(find modules preload_configs -type f -name '*.sh' ! -name '#*')
          shellcheck --shell=bash --severity=warning "${targets[@]}"
          echo "::endgroup::"
        shell: bash

  version-stamp:
    name: VERSION matches commit count
    runs-on: ubuntu-latest
    steps:
      # Full history is required: bump-version derives the stamp from the commit
      # count, and the default shallow checkout would report a count of 1.
      # On a pull request, check out the branch head rather than the synthetic
      # merge commit, whose extra commit shifts the count by one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check VERSION against history
        run: |
          # Merge commits are exempt. Hooks do not run on a merge, and VERSION
          # conflicts on every one of them because both sides bumped it, so the
          # stamp there depends on how a human resolved the conflict. The next
          # ordinary commit is checked normally, which is where real drift shows.
          if git rev-parse --verify -q 'HEAD^2' >/dev/null; then
            echo "HEAD is a merge commit; skipping (hooks do not run on merges)"
            exit 0
          fi

          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing"
            exit 1
          fi

          actual=$(tr -d '[:space:]' < VERSION)
          count=$(git rev-list --count HEAD)
          expected="2.0.${count}"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error file=VERSION::VERSION is $actual but history says $expected"
            echo "VERSION is generated by scripts/bump-version.sh from the commit"
            echo "count, as an always-run pre-commit hook. A mismatch means that"
            echo "hook did not run, which means shellcheck and markdownlint did"
            echo "not run on those commits either. The stamp is the visible"
            echo "symptom; the missing gates are the actual problem."
            echo ""
            echo "Fix on the machine that made the commits:"
            echo "  pre-commit install"
            echo "  bash scripts/bump-version.sh && git add VERSION"
            exit 1
          fi

          echo "VERSION $actual matches $count commits"
        shell: bash

