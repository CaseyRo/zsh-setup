# Helix language config, symlinked by install/helix.sh to
# ~/.config/helix/languages.toml. Dev profile only: every binary named here is
# installed by a --dev array in install/packages.sh, and this file is only
# deployed when that profile is on.
#
# Deliberately small. Helix already knows bash-language-server, taplo, marksman,
# yaml-language-server, gopls, intelephense, typescript-language-server and the
# vscode-* servers by name, so installing the binary is the whole integration.
# Restating a server here would only pin us to a name upstream might change, so
# the only language-servers override below is python, where the default differs.
#
# Helix ships no formatter defaults at all (verified: every language reports
# `None` with this file removed), so formatters are the real content here.
#
# auto-format stays off everywhere, matching Cursor, which runs without
# formatOnSave on this setup. `:format`, or `+f` from the task mode in
# config.toml, runs one on demand.
#
# Every formatter below was measured against this repo's own files before being
# wired. The ones that would rewrite existing code are documented as absences
# rather than silently omitted, so the decision is re-checkable.

# ============================================================================
# Shell
# ============================================================================
# bash-language-server shells out to shellcheck when it is on PATH, which puts
# this repo's own pre-commit and CI gate inline while editing. Both are in the
# dev arrays for that reason.
#
# No formatter. shfmt's closest configuration (-i 4 -ci) rewrites 1225 lines
# across install.sh, install/*.sh, bootstrap.sh and scripts/*.sh. It disagrees
# on things it has no flag for: spacing inside `(( ))`, spacing around `|` in
# case patterns, and collapsing aligned line continuations. Both -sr and -bn
# made it worse. Bound to a keystroke that is a hundred-line diff unrelated to
# the edit. shfmt is still installed; run it deliberately with `shfmt -w` on
# new files.

# ============================================================================
# Config and data formats
# ============================================================================
# toml has no formatter for the same reason. taplo collapses the aligned key
# columns in configs/herdr/config.toml and this directory's palettes into
# single-space form, and align_entries=true disagrees with more files rather
# than fewer. The taplo language server still runs, giving schema validation,
# completion and hover.
#
# json has no formatter. prettier reindents configs/cursor/User/*.json from four
# spaces to two and collapses the arrays in .wiki-compiler.json onto one line,
# and no single prettier setting matches both the 2-space and 4-space json in
# this repo.

# yaml is the one case verified byte-clean: prettier already agrees with every
# yaml file here, so wiring it changes nothing today and keeps new files
# consistent.
[[language]]
name = "yaml"
formatter = { command = "prettier", args = ["--parser", "yaml"] }

# ============================================================================
# Docs
# ============================================================================
# No formatter. markdownlint is the gate this repo actually enforces, and
# prettier disagrees with it on list indentation and wrapping, so running it
# here would produce churn that pre-commit then fights.
[[language]]
name = "markdown"
text-width = 80
soft-wrap = { enable = true }

# ============================================================================
# Python
# ============================================================================
# The one server override: Helix defaults to ty, and ruff covers lint, format
# and LSP in a single fast binary that uv already puts on these machines.
[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["ruff"]
formatter = { command = "ruff", args = ["format", "-"] }

# ============================================================================
# Web
# ============================================================================
# prettier is kept here rather than dropped like it is for json: this repo holds
# no typescript, javascript, css or html of its own, so there is nothing to
# churn, and prettier is the ecosystem default those files are written against
# in the projects that do have them.
[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "tsx"
formatter = { command = "prettier", args = ["--parser", "typescript"] }

[[language]]
name = "javascript"
formatter = { command = "prettier", args = ["--parser", "babel"] }

[[language]]
name = "jsx"
formatter = { command = "prettier", args = ["--parser", "babel"] }

[[language]]
name = "css"
formatter = { command = "prettier", args = ["--parser", "css"] }

[[language]]
name = "html"
formatter = { command = "prettier", args = ["--parser", "html"] }

# ============================================================================
# PHP
# ============================================================================
# intelephense is Helix's default server and works unlicensed; the paid key only
# unlocks extras. No formatter: stock prettier cannot parse PHP without
# @prettier/plugin-php, and install/php-dev.sh already provides phpcbf, which
# fixes to the WordPress standard rather than prettier's opinion. Run that
# against files directly.
